syntax = "proto3";

package tunnel.v1;

option go_package = "tunnel/v1;tunnelv1";

// ProxyService handles tunnel registration and connection signaling.
service ProxyService {
  // Long-lived bi-directional stream for control signals
  rpc ControlChannel (stream ClientControlMessage) returns (stream ServerControlMessage);

  // Bi-directional stream for raw payload piping (Data Plane)
  rpc DataPipe (stream DataPacket) returns (stream DataPacket);
}

// --- Control Messages ---

message ClientControlMessage {
  oneof message {
    HelloRequest hello = 1;
    // Client notifies server it has connected to the data stream
    AcceptAck accept_ack = 2;
  }
}

message ServerControlMessage {
  oneof message {
    HelloResponse hello_response = 1;
    // Server signals client that an external TCP user connected
    NewConnectionEvent new_connection = 2;
  }
}

message HelloRequest {
  string secret = 1;           // Optional authentication secret
  uint32 requested_port = 2;   // Port client wants server to listen on
}

message HelloResponse {
  bool success = 1;
  string error_message = 2;
  uint32 assigned_port = 3;
}

message NewConnectionEvent {
  string connection_id = 1;    // Random UUID generated by server
  string remote_addr = 2;      // Optional: Client source address for logs/metrics
}

message AcceptAck {
  string connection_id = 1;
}

// --- Data Messages ---

message DataPacket {
  // connection_id is sent in the FIRST DataPacket frame when establishing DataPipe
  string connection_id = 1;
  bytes payload = 2;
}